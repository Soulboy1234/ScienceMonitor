name: CI

on:
  push:
    branches:
      - "**"
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Bootstrap local environment
        run: PYTHON="$(which python)" ./scripts/bootstrap_local_env.sh

      - name: Prepare CI output directory
        run: mkdir -p "$GITHUB_WORKSPACE/out"

      - name: Run harness check
        env:
          SCIENCEMONITOR_OUTPUT_ROOT: ${{ github.workspace }}/out
        run: ./scripts/run_science_monitor.sh harness-check

      - name: Run test suite
        run: ./.venv/bin/python -m pytest -q
